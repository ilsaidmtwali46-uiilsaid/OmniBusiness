<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تفعيل ترخيص التشغيل — مزرعة الإخلاص</title>
<style>
:root{--green:#166534;--pale:#f0fdf4;--ink:#17211b;--muted:#64748b;--wa:#25D366}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f7f4;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px}
.card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:400px;box-shadow:0 10px 25px rgba(0,0,0,0.08);text-align:center;border:1px solid #e2e8f0}
h1{font-size:20px;color:var(--green);margin:0 0 10px}
p{font-size:13px;color:var(--muted);margin:0 0 20px}
label{display:block;text-align:right;font-size:12px;font-weight:bold;margin-bottom:6px}
input{width:100%;padding:12px;font-size:15px;border:1px solid #cbd5cf;border-radius:10px;text-align:center;font-weight:bold;letter-spacing:1px;margin-bottom:15px}
button.action{width:100%;padding:12px;background:var(--green);color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
.wa-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:var(--wa);color:#fff;border-radius:10px;text-decoration:none;font-weight:bold;font-size:14px;margin-top:12px}
.footer-text{font-size:11px;color:var(--muted);margin-top:15px;line-height:1.5}
</style>
</head>
<body>

<div class="card">
  <h1>🔒 تفعيل ترخيص التشغيل</h1>
  <p>الرجاء إدخال كود التشغيل المقدم من الإدارة لفتح التطبيق</p>
  
  <label>كود التفعيل (License Key)</label>
  <input id="keyInput" placeholder="مثال: OMNI-2026-XXXX">
  
  <button class="action" onclick="verifyKey()">تحقق وتفعيل</button>
  
  <hr style="margin:20px 0;border:0;border-top:1px solid #eee">
  
  <div class="footer-text">
    للحصول على كود التشغيل أو تجديد الترخيص، يرجى التواصل مباشر مع إدارة مزرعة الإخلاص (السيد متولي).
  </div>

  <!-- زر واتساب المباشر -->
  <a id="waLink" class="wa-btn" href="#" target="_blank">
    💬 تواصل عبر الواتساب لتفعيل الترخيص
  </a>
</div>

<script>
// ضع رقم هاتفك مع كود الدولة بدلاً من الرقم التالي (مثال: 2010xxxxxxx)
const MY_PHONE_NUMBER = '201000000000'; 

document.getElementById('waLink').href = `https://wa.me/${MY_PHONE_NUMBER}?text=${encodeURIComponent('السلام عليكم أستاذ سيد متولي، أرغب في الحصول على كود تفعيل لتطبيق مزرعة الإخلاص.')}`;

function verifyKey() {
  let val = document.getElementById('keyInput').value.trim();
  if(!val) { alert('الرجاء إدخال الكود أولاً'); return; }
  
  // حفظ التفعيل والرمز
  localStorage.setItem('omni_app_license_verified', 'true');
  localStorage.setItem('omni_active_key', val);
  
  alert('🟢 تم التفعيل بنجاح! مرحباً بك في تطبيق مزرعة الإخلاص.');
  window.location.href = 'index.html';
}
</script>

</body>
</html>
